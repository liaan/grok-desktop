# Builds installers for Windows, macOS, and Linux.
# Release process for agents: see AGENTS.md (canonical).
# Team install: see README.md.
#
# Auto-update needs: installers + latest*.yml (+ blockmaps, mac zip).
# CI still uses --publish never; softprops uploads those files to the Release.

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            args: --win
          - os: macos-latest
            label: macOS
            args: --mac
          - os: ubuntu-latest
            label: Linux
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "OK: tag v$TAG matches package.json $PKG"

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run build && npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned builds for internal team use (SmartScreen / Gatekeeper one-time warning).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grok-desktop-${{ matrix.label }}
          # Installers for humans + yml/blockmap/zip for electron-updater
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist-installers
          merge-multiple: true

      - name: List files
        run: find dist-installers -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Grok Desktop ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Install (no npm)

            Download the file for your OS below. After the first install, the app checks GitHub Releases and can update itself.

            | OS | Look for |
            |----|----------|
            | **Windows** | `GrokDesktop-…-win-…-Setup.exe` (installer; preferred for auto-update) |
            | **macOS** | `GrokDesktop-…-mac-arm64.dmg` (Apple Silicon) or `…-mac-x64.dmg` (Intel) |
            | **Linux** | `GrokDesktop-…-linux-….AppImage` — `chmod +x` then run |

            Also install the **Grok Build CLI** (`grok`) — this app is only the GUI.

            Unsigned build: Windows → More info → Run anyway. macOS → right-click → Open.

            Full team instructions: repository README.
          files: |
            dist-installers/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
