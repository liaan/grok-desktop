# Builds simple installers: Windows Setup.exe + macOS DMGs + Linux AppImage.
# GitHub also offers Source code (zip) on every tag automatically.
# Release process: AGENTS.md. Team install: README.md.

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# One group per tag/ref. Never cancel-in-progress: killing a matrix mid-upload
# leaves incomplete artifacts and "other side closed" on download-artifact.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            args: --win
          - os: macos-latest
            label: macOS
            args: --mac
          - os: ubuntu-latest
            label: Linux
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Build toolchain (npm, Vite, electron-builder). Not the Node
          # version inside the packaged app — Electron 35 embeds Node 22.
          # JS *actions* use the runner action runtime (Node 24); unrelated.
          node-version: "22"
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "OK: tag v$TAG matches package.json $PKG"

      # Persist electron + electron-builder toolsets across runs (NSIS, icons, …).
      # Restore BEFORE npm ci — electron's postinstall downloads the binary.
      # IMPORTANT: cache MUST live outside the repo. package.json has "type":"module",
      # and electron-builder's icon-tool.js is CJS — if it runs under the project tree
      # Node treats it as ESM and fails with "require is not defined".
      - name: Cache Electron toolchains
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ runner.os }}-${{ runner.arch }}-eb-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-eb-

      - name: Install dependencies
        shell: bash
        env:
          # runner.* is valid on steps, not job-level env.
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: |
          set -uo pipefail
          mkdir -p "${ELECTRON_CACHE}" "${ELECTRON_BUILDER_CACHE}"
          # Retry: Linux often socket-hangs downloading Electron during postinstall.
          max=3
          attempt=1
          while [ "$attempt" -le "$max" ]; do
            echo "=== npm ci attempt ${attempt}/${max} ==="
            set +e
            npm ci
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "npm ci succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "npm ci exited ${status} on attempt ${attempt}"
            if [ "$attempt" -eq "$max" ]; then
              exit "$status"
            fi
            rm -rf node_modules
            delay=$((attempt * 20))
            echo "Retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Build installers
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: |
          set -uo pipefail
          mkdir -p "${ELECTRON_CACHE}" "${ELECTRON_BUILDER_CACHE}"
          echo "node=$(node -v) npm=$(npm -v)"
          echo "ELECTRON_CACHE=${ELECTRON_CACHE}"
          echo "ELECTRON_BUILDER_CACHE=${ELECTRON_BUILDER_CACHE}"
          echo "electron-builder=$(./node_modules/.bin/electron-builder --version || true)"

          npm run build

          # Prefer local install (npm ci). Fall back to npx only if missing.
          EB="./node_modules/.bin/electron-builder"
          if [ ! -x "$EB" ]; then
            EB="npx electron-builder"
          fi

          # Retry only for flaky network downloads (ECONNRESET on Windows is common).
          # Do not use `set -e` around the if-retry body — failed attempts must continue.
          max=3
          attempt=1
          while [ "$attempt" -le "$max" ]; do
            echo "=== electron-builder attempt ${attempt}/${max} (${{ matrix.args }}) ==="
            # Clean partial output from a previous failed attempt
            rm -rf release
            set +e
            $EB ${{ matrix.args }} --publish never
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "electron-builder succeeded on attempt ${attempt}"
              ls -la release || true
              exit 0
            fi
            echo "electron-builder exited ${status} on attempt ${attempt}"
            if [ "$attempt" -eq "$max" ]; then
              echo "electron-builder failed after ${max} attempts"
              exit "$status"
            fi
            delay=$((attempt * 30))
            echo "Retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Prepare release artifacts
        shell: bash
        run: |
          # Keep human installers + auto-update metadata (yml/zip/blockmap).
          # Do NOT delete latest*.yml, mac zip, or the Linux AppImage —
          # electron-updater needs yml/zip; AppImage is the Linux team file.
          cd release
          # mac: friendlier DMG names (zip keeps -arm64 / -x64 for latest-mac.yml)
          if ls GrokDesktop-*-Mac-arm64.dmg 1>/dev/null 2>&1; then
            for f in GrokDesktop-*-Mac-arm64.dmg; do
              mv "$f" "${f%-Mac-arm64.dmg}-Mac-AppleSilicon.dmg"
            done
          fi
          if ls GrokDesktop-*-Mac-x64.dmg 1>/dev/null 2>&1; then
            for f in GrokDesktop-*-Mac-x64.dmg; do
              mv "$f" "${f%-Mac-x64.dmg}-Mac-Intel.dmg"
            done
          fi
          echo "=== Release files ==="
          ls -la

      # Retry: Windows runners often drop the connection mid-upload ("other side closed").
      - name: Upload installers
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/upload-artifact@v6
          attempt_limit: 5
          attempt_delay: 20000
          with: |
            name: grok-desktop-${{ matrix.label }}
            path: |
              release/*.exe
              release/*.dmg
              release/*.zip
              release/*.AppImage
              release/latest*.yml
              release/*.blockmap
            if-no-files-found: error
            retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build
    # Win/mac artifacts are enough for a Release. A flaky Linux npm ci must
    # not skip latest.yml / latest-mac.yml (Preview updates 404s without them).
    if: always() && startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest

    steps:
      # Retry: flaky GitHub artifact CDN ("other side closed") is common and is
      # *not* fixed by downgrading to download-artifact@v4 (that reintroduces
      # Node 20 deprecation). Keep @v6 + retries.
      - name: Download installers
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/download-artifact@v6
          attempt_limit: 5
          attempt_delay: 20000
          with: |
            path: dist-installers
            merge-multiple: true

      - name: List files
        run: find dist-installers -type f | sort

      - name: Verify installers present
        run: |
          set -euo pipefail
          exe=$(find dist-installers -type f -name '*.exe' | wc -l)
          dmg=$(find dist-installers -type f -name '*.dmg' | wc -l)
          yml=$(find dist-installers -type f -name 'latest*.yml' | wc -l)
          appimage=$(find dist-installers -type f -name '*.AppImage' | wc -l)
          echo "Found ${exe} .exe, ${dmg} .dmg, ${yml} latest*.yml, ${appimage} .AppImage"
          find dist-installers -type f | sort
          # Team auto-update needs Win + mac + yml. Linux AppImage is best-effort
          # (ubuntu electron download flakes; do not skip the whole Release).
          if [ "$exe" -lt 1 ] || [ "$dmg" -lt 1 ] || [ "$yml" -lt 1 ]; then
            echo "Need Windows .exe, macOS .dmg, and latest*.yml after download-artifact."
            exit 1
          fi
          if [ "$appimage" -lt 1 ]; then
            echo "WARNING: no Linux AppImage (Linux job likely failed). Publishing Win/mac anyway."
          fi

      # Tag is vX.Y.Z; installer names use X.Y.Z (no "v")
      - name: Version for asset URLs
        id: ver
        run: echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # v3 runs on Node 24 (v2 is Node 20 and deprecated on GH runners).
        uses: softprops/action-gh-release@v3
        with:
          name: Grok Desktop ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Download (click your platform)

            | You have… | Installer (click to download) |
            |-----------|-------------------------------|
            | **Windows** | [GrokDesktop-${{ steps.ver.outputs.app_version }}-Windows-Setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/GrokDesktop-${{ steps.ver.outputs.app_version }}-Windows-Setup.exe) |
            | **Mac (M1 / M2 / M3 / M4)** | [GrokDesktop-${{ steps.ver.outputs.app_version }}-Mac-AppleSilicon.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/GrokDesktop-${{ steps.ver.outputs.app_version }}-Mac-AppleSilicon.dmg) |
            | **Mac (Intel)** | [GrokDesktop-${{ steps.ver.outputs.app_version }}-Mac-Intel.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/GrokDesktop-${{ steps.ver.outputs.app_version }}-Mac-Intel.dmg) |
            | **Linux (x64)** | [GrokDesktop-${{ steps.ver.outputs.app_version }}-Linux-x64.AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/GrokDesktop-${{ steps.ver.outputs.app_version }}-Linux-x64.AppImage) |

            **Team install = one of those four links only.**

            Other Assets (`latest.yml`, `latest-mac.yml`, `latest-linux.yml`, Mac `.zip`, blockmaps) are for **in-app auto-update** (Help → Check for updates). You do not need them by hand. GitHub’s **Source code** zip is only if you build from source.

            ### After download
            1. Install **Grok Build CLI** (`grok`) — this app is only the GUI.
            2. **Windows:** run Setup → if SmartScreen: More info → Run anyway.
            3. **Mac:** drag app to Applications, eject DMG, then in Terminal:
               `xattr -cr "/Applications/Grok Desktop.app"`
               (macOS says “damaged” for unsigned Safari downloads — that command clears quarantine; app is fine.)
            4. **Linux:** `chmod +x` the AppImage, then run it.
            5. Open app → **Sign in with browser** → **Open project…**
            6. Later: **Help → Check for updates…** downloads and installs in-app (no browser).
          files: |
            dist-installers/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
