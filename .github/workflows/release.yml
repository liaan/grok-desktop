# Builds simple installers only: Windows Setup.exe + macOS DMGs.
# GitHub also offers Source code (zip) on every tag automatically.
# Release process: AGENTS.md. Team install: README.md.

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            args: --win
          - os: macos-latest
            label: macOS
            args: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "OK: tag v$TAG matches package.json $PKG"

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run build && npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Keep only human installers
        shell: bash
        run: |
          # Drop blockmaps, yml, zips, and any other electron-builder noise
          cd release
          rm -f *.blockmap latest*.yml *.zip *.AppImage 2>/dev/null || true
          # mac: friendlier names (arm64 = Apple Silicon, x64 = Intel)
          if ls GrokDesktop-*-Mac-arm64.dmg 1>/dev/null 2>&1; then
            for f in GrokDesktop-*-Mac-arm64.dmg; do
              mv "$f" "${f%-Mac-arm64.dmg}-Mac-AppleSilicon.dmg"
            done
          fi
          if ls GrokDesktop-*-Mac-x64.dmg 1>/dev/null 2>&1; then
            for f in GrokDesktop-*-Mac-x64.dmg; do
              mv "$f" "${f%-Mac-x64.dmg}-Mac-Intel.dmg"
            done
          fi
          echo "=== Release files ==="
          ls -la

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: grok-desktop-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist-installers
          merge-multiple: true

      - name: List files
        run: find dist-installers -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Grok Desktop ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Download one file for your computer

            | You have… | Download |
            |-----------|----------|
            | **Windows** | `GrokDesktop-…-Windows-Setup.exe` |
            | **Mac (M1 / M2 / M3 / M4)** | `GrokDesktop-…-Mac-AppleSilicon.dmg` |
            | **Mac (Intel)** | `GrokDesktop-…-Mac-Intel.dmg` |
            | **Source code** | Use GitHub’s **Source code (zip)** under Assets |

            Ignore anything else. You do **not** need AppImage, blockmap, yaml, or portable builds.

            ### After download
            1. Install **Grok Build CLI** (`grok`) on the machine — this app is only the GUI.
            2. Open the app → **Sign in with browser** → **Open project…**
            3. Windows may show SmartScreen → **More info → Run anyway**. Mac → right-click → **Open** the first time.
          files: |
            dist-installers/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
