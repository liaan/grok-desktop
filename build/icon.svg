<svg width="1024" height="1024" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Grok Desktop — monochrome AI mark (black / white) -->
  <rect width="32" height="32" rx="7.5" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.25" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Outer orbit (AI / systems) -->
  <circle cx="16" cy="16" r="10" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
  <!-- Partial arc highlight -->
  <path
    d="M16 6 A10 10 0 0 1 26 16"
    stroke="#FFFFFF"
    stroke-opacity="0.85"
    stroke-width="1.35"
    stroke-linecap="round"
  />

  <!-- Grok spark (8-point star) -->
  <path
    d="M16 8.2 L17.35 13.65 L22.8 15 L17.35 16.35 L16 21.8 L14.65 16.35 L9.2 15 L14.65 13.65 Z"
    fill="#FFFFFF"
  />
  <!-- Core node -->
  <circle cx="16" cy="15" r="1.55" fill="#0A0A0A"/>
  <circle cx="16" cy="15" r="0.85" fill="#FFFFFF"/>

  <!-- Constellation nodes on orbit -->
  <circle cx="26" cy="16" r="1.15" fill="#FFFFFF"/>
  <circle cx="9.5" cy="23.2" r="0.85" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="11.2" cy="8.6" r="0.7" fill="#FFFFFF" fill-opacity="0.75"/>
</svg>
