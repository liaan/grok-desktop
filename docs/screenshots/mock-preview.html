<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Grok Desktop — Preview window</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f3f7;
      --bar: #ffffff;
      --border: #d4d4e0;
      --text: #14141c;
      --muted: #5a5a6e;
      --input: #f7f7fb;
      --accent: #7c3aed;
      --font: "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(167, 139, 250, 0.22), transparent 50%),
        linear-gradient(180deg, #e4e8f4 0%, #d5dde8 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 36px;
    }
    .window {
      width: 1120px;
      height: 720px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #c8c8d6;
      box-shadow: 0 30px 80px rgba(40, 40, 70, 0.16), 0 0 0 1px rgba(255,255,255,0.7) inset;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .titlebar {
      height: 36px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafafc;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .titlebar strong { color: var(--text); font-weight: 650; }
    .dots { display: flex; gap: 6px; }
    .dots i {
      width: 10px; height: 10px; border-radius: 50%;
      background: #d4d4e0; display: block;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bar);
      border-bottom: 1px solid var(--border);
    }
    .nav { display: flex; gap: 4px; }
    button {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 30px;
      min-width: 30px;
      padding: 0 8px;
      font: 12px/1 var(--font);
      font-weight: 600;
    }
    .url-form { flex: 1; min-width: 0; }
    .url {
      width: 100%;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input);
      color: var(--text);
      padding: 0 10px;
      font: 12px/30px var(--font);
    }
    .viewport {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .viewport span {
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 30px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      background: var(--input);
    }
    .guest {
      flex: 1;
      background: #fff;
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 0;
    }
    .side {
      border-right: 1px solid #ececf3;
      padding: 22px 16px;
      background: #fafafc;
    }
    .side h2 { margin: 0 0 12px; font-size: 13px; }
    .navitem {
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 8px;
      color: var(--muted);
    }
    .navitem.on { background: #eee9ff; color: var(--accent); font-weight: 600; }
    .page { padding: 28px 32px; }
    .page h1 { margin: 0 0 8px; font-size: 26px; }
    .page p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      max-width: 420px;
    }
    .card label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .card input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      padding: 0 10px;
    }
    .card .primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
      height: 34px;
      padding: 0 14px;
    }
    .caption {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      font-size: 12px;
      color: #4a4a60;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div><strong>Login · Preview</strong> — drag to another screen</div>
      <div>Grok Desktop</div>
    </div>
    <div class="bar">
      <div class="nav">
        <button type="button">←</button>
        <button type="button">→</button>
        <button type="button">↻</button>
      </div>
      <div class="url-form">
        <div class="url">http://localhost:5173/login</div>
      </div>
      <div class="viewport">Size <span>Fluid</span></div>
      <button type="button">Snapshot</button>
      <button type="button">Screenshot</button>
      <button type="button">↗</button>
    </div>
    <div class="guest">
      <aside class="side">
        <h2>Acme</h2>
        <div class="navitem">Home</div>
        <div class="navitem on">Sign in</div>
        <div class="navitem">Docs</div>
      </aside>
      <section class="page">
        <h1>Sign in</h1>
        <p>The agent can open this window, snapshot the page, then click and type here.</p>
        <div class="card">
          <label>Email</label>
          <input value="dev@example.com" readonly />
          <label>Password</label>
          <input type="password" value="••••••••" readonly />
          <button class="primary" type="button">Sign in</button>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
